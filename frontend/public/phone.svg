<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" fill="none">
  <defs>
    <linearGradient id="frame" x1="110" y1="20" x2="430" y2="740" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b7385"/>
      <stop offset="0.18" stop-color="#2a3040"/>
      <stop offset="0.52" stop-color="#121722"/>
      <stop offset="0.82" stop-color="#343b4c"/>
      <stop offset="1" stop-color="#0b0e16"/>
    </linearGradient>
    <linearGradient id="bezel" x1="90" y1="30" x2="430" y2="730" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050609"/>
      <stop offset="1" stop-color="#11151d"/>
    </linearGradient>
    <linearGradient id="screen" x1="108" y1="50" x2="412" y2="718" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10192b"/>
      <stop offset="0.45" stop-color="#08101e"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(318 214) rotate(125) scale(300 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff8a5b" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ff5a2a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff5a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura2" cx="0" cy="0" r="1" gradientTransform="translate(160 560) rotate(-45) scale(230 260)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a4e33f" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a4e33f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="110" y1="40" x2="415" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.17"/>
      <stop offset="0.32" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="0.65" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="rim" x1="74" y1="40" x2="446" y2="710" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a9b2c5" stop-opacity="0.95"/>
      <stop offset="0.2" stop-color="#414957"/>
      <stop offset="0.5" stop-color="#0f131c"/>
      <stop offset="0.8" stop-color="#586173"/>
      <stop offset="1" stop-color="#161b25"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#596174"/>
      <stop offset="1" stop-color="#1c2230"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="94" y="34" width="332" height="692" rx="45"/>
    </clipPath>
  </defs>

  <ellipse cx="260" cy="718" rx="150" ry="20" fill="#000" opacity="0.55" filter="url(#soft)"/>

  <!-- Side buttons -->
  <rect x="64" y="180" width="7" height="46" rx="3.5" fill="url(#button)"/>
  <rect x="64" y="242" width="7" height="76" rx="3.5" fill="url(#button)"/>
  <rect x="449" y="214" width="7" height="98" rx="3.5" fill="url(#button)"/>

  <!-- Titanium frame -->
  <rect x="64" y="8" width="392" height="744" rx="66" fill="url(#frame)"/>
  <rect x="64" y="8" width="392" height="744" rx="66" stroke="url(#rim)" stroke-width="2.5"/>

  <!-- Inner bezel -->
  <rect x="80" y="24" width="360" height="712" rx="54" fill="url(#bezel)"/>
  <rect x="80.75" y="24.75" width="358.5" height="710.5" rx="53.25" stroke="#000" stroke-opacity="0.9" stroke-width="1.5"/>

  <!-- Screen -->
  <g clip-path="url(#screenClip)">
    <rect x="94" y="34" width="332" height="692" fill="url(#screen)"/>
    <rect x="94" y="34" width="332" height="692" fill="url(#aura)"/>
    <rect x="94" y="34" width="332" height="692" fill="url(#aura2)"/>
    <rect x="94" y="34" width="332" height="692" fill="url(#shine)"/>

    <!-- Abstract wallpaper rings -->
    <circle cx="330" cy="190" r="112" stroke="#ffb088" stroke-opacity="0.22" stroke-width="1.5"/>
    <circle cx="330" cy="190" r="158" stroke="#ffb088" stroke-opacity="0.1" stroke-width="1.2"/>
    <circle cx="330" cy="190" r="204" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    <path d="M120 470c74-120 176-96 236-196" stroke="#ffb088" stroke-opacity="0.16" stroke-width="1.5"/>
    <path d="M108 520c90-130 198-102 268-208" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

    <!-- Status bar -->
    <text x="128" y="76" fill="#ffffff" opacity="0.86" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600">9:41</text>
    <g fill="#ffffff" opacity="0.8">
      <rect x="340" y="66" width="3" height="6" rx="1"/>
      <rect x="346" y="63" width="3" height="9" rx="1"/>
      <rect x="352" y="60" width="3" height="12" rx="1"/>
      <rect x="358" y="57" width="3" height="15" rx="1"/>
      <path d="M371 73h13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2Z" opacity="0.9"/>
      <rect x="385" y="64" width="17" height="10" rx="3" stroke="#fff" stroke-opacity="0.7" stroke-width="1.2" fill="none"/>
      <rect x="387" y="66" width="11" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="403" y="67" width="2" height="4" rx="1" fill="#fff" opacity="0.5"/>
    </g>

    <!-- Lock screen content -->
    <text x="260" y="188" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="68" font-weight="200" letter-spacing="-2">09:41</text>
    <text x="260" y="216" text-anchor="middle" fill="#ffffff" opacity="0.5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" letter-spacing="2.4">THURSDAY, 28 OCTOBER</text>

    <!-- Notification card -->
    <g opacity="0.94">
      <rect x="122" y="262" width="276" height="74" rx="20" fill="#ffffff" fill-opacity="0.09"/>
      <rect x="122.5" y="262.5" width="275" height="73" rx="19.5" stroke="#ffffff" stroke-opacity="0.13"/>
      <rect x="138" y="278" width="42" height="42" rx="12" fill="#ff6433"/>
      <path d="M163 286l-10 14h6l-1 12 10-15h-6l1-11Z" fill="#05070d"/>
      <text x="192" y="290" fill="#ffffff" opacity="0.9" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="600">FLASHSALE</text>
      <text x="192" y="307" fill="#ffffff" opacity="0.78" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11">Aether X1 Pro drop is live.</text>
      <text x="192" y="322" fill="#ffffff" opacity="0.4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9">500 units · one per checkout</text>
    </g>

    <g opacity="0.55">
      <rect x="122" y="348" width="276" height="58" rx="18" fill="#ffffff" fill-opacity="0.05"/>
      <circle cx="152" cy="377" r="13" fill="#c0f56a" fill-opacity="0.18"/>
      <path d="M146 377l4 4 7-8" stroke="#c0f56a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="176" y="374" fill="#ffffff" opacity="0.75" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="10">Inventory verification active</text>
      <text x="176" y="389" fill="#ffffff" opacity="0.35" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="9">PostgreSQL ledger · Redis admission</text>
    </g>

    <!-- Bottom bars -->
    <rect x="196" y="680" width="128" height="5" rx="2.5" fill="#ffffff" opacity="0.55"/>
    <g opacity="0.35">
      <rect x="128" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.12"/>
      <rect x="166" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
      <rect x="204" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
      <rect x="242" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
      <rect x="280" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
      <rect x="318" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
      <rect x="356" y="648" width="26" height="26" rx="8" fill="#fff" fill-opacity="0.07"/>
    </g>
  </g>

  <!-- Dynamic island -->
  <rect x="212" y="52" width="96" height="28" rx="14" fill="#020304"/>
  <circle cx="292" cy="66" r="4.5" fill="#101820"/>
  <circle cx="292" cy="66" r="1.6" fill="#2a4a6b"/>

  <!-- Glass reflections -->
  <path d="M94 90c0-31 0-46 45-46h40L106 300V90Z" fill="#ffffff" opacity="0.035"/>
  <path d="M400 570c0 42 0 112-50 144h-80l130-190v46Z" fill="#ffffff" opacity="0.025"/>

  <!-- Metallic edge highlights -->
  <path d="M84 660c0 43 29 70 62 72" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
  <path d="M438 120c0-44-24-74-58-80" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
</svg>
