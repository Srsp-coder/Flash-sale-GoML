name: flashsale

x-backend-environment: &backend-environment
  NODE_ENV: production
  PORT: 3000
  HOST: 0.0.0.0
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://flashsale:${POSTGRES_PASSWORD:-flashsale_secret}@postgres:5432/flashsale?schema=public
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://flashsale:${RABBITMQ_PASSWORD:-flashsale_secret}@rabbitmq:5672
  RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
  RABBITMQ_MANAGEMENT_USER: flashsale
  RABBITMQ_MANAGEMENT_PASSWORD: ${RABBITMQ_PASSWORD:-flashsale_secret}
  QUEUE_PREFIX: flashsale
  REDIS_KEY_PREFIX: flashsale
  INITIAL_STOCK: ${INITIAL_STOCK:-500}
  CORS_ORIGIN: http://localhost:${WEB_PORT:-8080},http://127.0.0.1:${WEB_PORT:-8080}
  RATE_LIMIT_WINDOW_MS: 60000
  RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20000}
  CHECKOUT_RATE_LIMIT_MAX: ${CHECKOUT_RATE_LIMIT_MAX:-20000}
  RATE_LIMIT_DISABLED: "false"
  REQUEST_BODY_LIMIT: 64kb
  RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-600}
  REDIS_ORPHAN_GRACE_SECONDS: 120
  WORKER_PREFETCH: ${WORKER_PREFETCH:-20}
  WORKER_PROCESSING_DELAY_MS: ${WORKER_PROCESSING_DELAY_MS:-350}
  WORKER_MAX_ATTEMPTS: 6
  WORKER_RETRY_BASE_MS: 2000
  OUTBOX_POLL_INTERVAL_MS: 1000
  OUTBOX_BATCH_SIZE: 25
  OUTBOX_MAX_ATTEMPTS: 12
  OUTBOX_BASE_BACKOFF_MS: 1000
  OUTBOX_MAX_BACKOFF_MS: 60000
  RECOVERY_INTERVAL_MS: 10000
  RECENT_ORDER_LIMIT: 12

x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: flashsale
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flashsale_secret}
      POSTGRES_DB: flashsale
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashsale -d flashsale"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: flashsale
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-flashsale_secret}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  migrate:
    <<: *backend-build
    environment:
      <<: *backend-environment
      NODE_ENV: production
    command: ["sh", "-c", "npx prisma migrate deploy && node prisma/seed.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend-build
    environment: *backend-environment
    command: ["node", "dist/server.js"]
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend-build
    environment: *backend-environment
    command: ["node", "dist/worker-entry.js"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  outbox:
    <<: *backend-build
    environment: *backend-environment
    command: ["node", "dist/outbox-entry.js"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
